user www-data;
worker_processes auto;
pid /run/adguardhome-doh-nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
}

include /etc/nginx/stream.d/adguardhome-doh.conf;

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /etc/nginx/sites-enabled/adguardhome-doh;
}
