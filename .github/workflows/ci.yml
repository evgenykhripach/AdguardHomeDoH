name: Systemd FDSTORE experiment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fdstore-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Exercise FDSTORE and flock on a disposable runner
        run: sudo -n bash tests/ubuntu_systemd_fdstore_smoke.sh
      - name: Exercise independent rollback timer on disposable files
        run: sudo -n bash tests/ubuntu_systemd_maintenance_smoke.sh
      - name: Verify maintenance snapshot and restore using disposable units
        run: >-
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" CI="$CI"
          RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT"
          bash tests/ubuntu_systemd_maintenance_transaction_smoke.sh "$PWD"
      - name: Verify private reload command using a disposable transient unit
        run: >-
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" CI="$CI"
          RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT"
          bash tests/ubuntu_systemd_private_reload_smoke.sh "$PWD"
