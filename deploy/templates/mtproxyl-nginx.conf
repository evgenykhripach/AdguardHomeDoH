user www-data;
worker_processes auto;
pid /run/adguardhome-doh-nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
}

include /etc/adguardhome-doh/mtproxyl-stream-site.conf;

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /etc/adguardhome-doh/mtproxyl-http-site.conf;
}
